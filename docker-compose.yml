x-database-url: &database-url "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-backend_core}?sslmode=disable"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-backend_core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Menjalankan semua migrasi lalu berhenti; api baru start setelah ini sukses.
  migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path=/migrations", "-database", *database-url, "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: backend-core-go:local
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
      JWT_TTL: ${JWT_TTL:-24h}
      JWT_ISSUER: ${JWT_ISSUER:-backend-core-go}
      RBAC_CACHE_TTL: ${RBAC_CACHE_TTL:-5m}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Dijalankan manual: docker compose run --rm seed
  seed:
    build: .
    image: backend-core-go:local
    entrypoint: ["/app/seed"]
    environment:
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_URL: *database-url
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]

volumes:
  pgdata:
